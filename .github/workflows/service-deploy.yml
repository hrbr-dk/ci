name: Service deploy

# Push-to-main deploy, identical for every service in the estate: build images,
# publish the chart, install that exact chart version from the registry.
#
# Nothing here names a host, a namespace or an account. Everything environment
# specific arrives as an input or a secret — see README.md.

on:
  workflow_call:
    inputs:
      service:
        description: Chart directory, release name, and package name. charts/<service> must exist.
        required: true
        type: string
      namespace:
        required: true
        type: string
      host:
        required: true
        type: string
      values-file:
        required: false
        type: string
        default: deploy/dev.yaml
      images:
        description: >-
          JSON array of images to build, e.g.
          [{"repository":"ghcr.io/org/svc","dockerfile":"src/Dockerfile","target":"final"}].
          `target` and `context` are optional; `set` names the values key that receives
          the tag, defaulting to image.tag.
        required: true
        type: string
      chart-registry:
        required: true
        type: string
      owner:
        description: Organisation the GitHub App token is minted for.
        required: true
        type: string
      test-command:
        required: false
        type: string
        default: ""
      submodules:
        required: false
        type: string
        default: "false"
      runs-on:
        required: false
        type: string
        default: self-hosted
      extra-set:
        description: Newline-separated key=value pairs appended to --set.
        required: false
        type: string
        default: ""
      timeout:
        required: false
        type: string
        default: 10m
    secrets:
      # Optional. A service with no private submodules needs no GitHub App at all —
      # checkout falls back to GITHUB_TOKEN, which can read its own repository.
      app-id:
        required: false
      private-key:
        required: false
    outputs:
      image-tag:
        value: ${{ jobs.deploy.outputs.image-tag }}
      chart-version:
        value: ${{ jobs.deploy.outputs.chart-version }}

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    env:
      # `secrets` cannot be read from a step-level `if:`; `env` can, and job-level
      # `env` may read secrets. This is the only reason this variable exists.
      APP_ID: ${{ secrets.app-id }}
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
      chart-version: ${{ steps.version.outputs.chart-version }}

    steps:
      - name: Generate token
        id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ inputs.owner }}

      - name: Rewrite SSH submodule URLs to HTTPS
        if: env.APP_ID != ''
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules == 'true' && 'recursive' || '' }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # The chart version is immutable and carries the commit, so a rollback is a
      # `--version` away and `helm list` says exactly which build is running.
      - name: Compute versions
        id: version
        run: |
          set -euo pipefail
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          base=$(awk '/^version:/ {print $2}' "charts/${{ inputs.service }}/Chart.yaml")
          echo "image-tag=$sha" >> "$GITHUB_OUTPUT"
          echo "chart-version=$base-main.$sha" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$sha" >> "$GITHUB_ENV"

      - name: Run tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each entry names the values key that receives its tag, so a service with a
      # separate migration image does not need the caller to repeat the tag it cannot
      # know yet.
      - name: Build and push images
        id: images
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          sets=""
          while IFS= read -r img; do
            repo=$(jq -r '.repository' <<<"$img")
            file=$(jq -r '.dockerfile' <<<"$img")
            target=$(jq -r '.target // empty' <<<"$img")
            context=$(jq -r '.context // "."' <<<"$img")
            key=$(jq -r '.set // "image.tag"' <<<"$img")

            args=(-f "$file" -t "$repo:$IMAGE_TAG")
            [ -n "$target" ] && args+=(--target "$target")
            docker build "${args[@]}" "$context"
            docker push "$repo:$IMAGE_TAG"

            sets="$sets$key=$IMAGE_TAG"$'\n'
          done < <(jq -c '.[]' <<<"$IMAGES")

          {
            echo "sets<<EOF"
            printf '%s' "$sets"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # No floating tag is pushed. A `latest` or `pr-<N>` tag combined with the default
      # IfNotPresent pull policy silently pins an environment to the first build it
      # ever saw, and the symptom is a deploy that reports success while running old code.
      - name: Publish and install the chart
        uses: hrbr-dk/ci/actions/helm-release@v1
        with:
          service: ${{ inputs.service }}
          chart-registry: ${{ inputs.chart-registry }}
          chart-version: ${{ steps.version.outputs.chart-version }}
          app-version: ${{ steps.version.outputs.image-tag }}
          namespace: ${{ inputs.namespace }}
          values-file: ${{ inputs.values-file }}
          timeout: ${{ inputs.timeout }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          set: |
            ${{ steps.images.outputs.sets }}
            host=${{ inputs.host }}
            ${{ inputs.extra-set }}

      - name: Show logs
        if: always()
        run: |
          kubectl -n "${{ inputs.namespace }}" logs \
            -l app.kubernetes.io/instance=${{ inputs.service }} --tail=100 || true

      - name: Prune build cache
        if: always()
        run: |
          docker image prune -f || true
          docker builder prune -f --keep-storage 20GB || true
